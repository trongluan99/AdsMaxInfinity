apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.ads.max'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'

    //admob
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'

    // Adjust
    implementation 'com.adjust.sdk:adjust-android:5.8.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Applovin SDK
    implementation 'com.applovin:applovin-sdk:13.6.4'
    // Google User Messaging Platform (CMP for GDPR/TCF v2.2)
    api 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Mediation Applovin
    implementation 'com.applovin.mediation:google-adapter:25.5.0.0'
    implementation 'com.applovin.mediation:ironsource-adapter:9.6.1.0.0'
    implementation 'com.applovin.mediation:vungle-adapter:7.7.9.0'
    implementation 'com.applovin.mediation:facebook-adapter:6.22.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.applovin.mediation:bytedance-adapter:8.3.0.4.1'
    implementation 'com.applovin.mediation:unityads-adapter:4.21.0.0'
    implementation 'com.applovin.mediation:mintegral-adapter:17.1.81.0'
    implementation 'com.applovin.mediation:fyber-adapter:8.4.7.0'

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.11.0"

    implementation 'com.google.firebase:firebase-analytics:24.0.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "com.android.billingclient:billing:9.1.0"

    implementation "com.google.guava:guava:33.7.2-android"

    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.12.0'

    //fb sdk
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'

    implementation 'com.airbnb.android:lottie:6.7.1'

    // appsflyer
    implementation 'com.appsflyer:af-android-sdk:7.0.1'
    implementation 'com.appsflyer:adrevenue:6.9.1'
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                groupId = "com.github.trongluan99"
                artifactId = "AdsMaxInfinity"
                version = "1.0.0"
            }
        }
    }
}