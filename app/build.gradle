plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ads.max.module'
    compileSdk 36

    defaultConfig {
        applicationId "com.pdfviewer.allinone.reader.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        def formattedDate = new Date().format('MMM.dd.yyyy')
        setProperty("archivesBaseName", "AmxStudio_v${versionName}(${versionCode})_${formattedDate}")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    flavorDimensions "default"
    productFlavors {
        appDev {
            //use id test when dev
            manifestPlaceholders = [ ad_app_id:"ca-app-pub-3940256099942544~3347511713"]
            buildConfigField "String", "ad_interstitial_splash", "\"c630fe3686063741\""
            buildConfigField "String", "ad_banner", "\"31cdd2e81ad9805e\""
            buildConfigField "String", "ad_reward", "\"5ac0003d6da0d104\""
            buildConfigField "String", "ad_reward_inter", "\"5ac0003d6da0d104\""
            buildConfigField "String", "ad_appopen_resume", "\"c630fe3686063741\""
            buildConfigField "String", "ad_native", "\"c7ade6e69facbf3b\""
            buildConfigField "String", "ads_open_app", "\"c630fe3686063741\""
            buildConfigField "Boolean", "env_dev", "false"

        }
        appProd {
            //add your id ad here
            manifestPlaceholders = [ ad_app_id:"ca-app-pub-3940256099942544~3347511713"]
            buildConfigField "String", "ad_interstitial_splash", "\"c630fe3686063741\""
            buildConfigField "String", "ad_banner", "\"31cdd2e81ad9805e\""
            buildConfigField "String", "ad_reward", "\"5ac0003d6da0d104\""
            buildConfigField "String", "ad_reward_inter", "\"5ac0003d6da0d104\""
            buildConfigField "String", "ad_appopen_resume", "\"c630fe3686063741\""
            buildConfigField "String", "ad_native", "\"c7ade6e69facbf3b\""
            buildConfigField "String", "ads_open_app", "\"c630fe3686063741\""
            buildConfigField "Boolean", "env_dev", "false"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation project(path: ':ads')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.core:core-ktx:1.8.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-splashscreen:1.0.0-rc01'
    implementation 'androidx.work:work-runtime-ktx:2.7.0'

    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Applovin
    implementation 'com.applovin:applovin-sdk:12.6.0'
}
repositories {
    mavenCentral()
}
